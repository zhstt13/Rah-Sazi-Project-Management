name: گزارش روزانهٔ کارگاه
description: ثبت تصویر روزانهٔ کنترل‌شده از کارگاه همراه با مقادیر، منابع، کیفیت و ایمنی.
title: "[روزانه] "
labels: ["میدانی:گزارش‌روزانه"]
body:
  - type: input
    id: report_id
    attributes:
      label: شناسهٔ گزارش
      placeholder: DR-2026-001
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: تاریخ
      placeholder: YYYY-MM-DD
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: جبههٔ کاری / کیلومتراژ / مکان
    validations:
      required: true
  - type: textarea
    id: work
    attributes:
      label: کار انجام‌شده و مقادیر اندازه‌گیری‌شده
      description: واحد، مقدار، کد WBS/BOQ و شواهد را درج کنید.
    validations:
      required: true
  - type: textarea
    id: resources
    attributes:
      label: نیروی انسانی، ماشین‌آلات و مصالح
    validations:
      required: true
  - type: textarea
    id: quality
    attributes:
      label: بازرسی‌ها، آزمایش‌ها و نقاط توقف کیفیت
    validations:
      required: true
  - type: textarea
    id: hse
    attributes:
      label: مشاهدات ایمنی، ترافیک و محیط‌زیست
    validations:
      required: true
  - type: textarea
    id: blockers
    attributes:
      label: محدودیت‌ها، مسائل و اقدامات بعدی
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: پیوند شواهد
