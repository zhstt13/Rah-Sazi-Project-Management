name: تصمیم پروژه
description: ثبت تصمیم مهم همراه با گزینه‌ها، مرجع اختیار، شواهد و پیامدها.
title: "[تصمیم] "
labels: ["کنترل:تصمیم", "نیازمند:بازبینی"]
body:
  - type: input
    id: decision_id
    attributes:
      label: شناسهٔ تصمیم
      placeholder: DEC-001
    validations:
      required: true
  - type: input
    id: question
    attributes:
      label: پرسش تصمیم
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: زمینه و واقعیت‌های مشاهده‌شده
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: گزینه‌ها و بده‌بستان‌ها
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: تصمیم و منطق آن
    validations:
      required: true
  - type: input
    id: authority
    attributes:
      label: مرجع اختیار و تاریخ تصمیم
    validations:
      required: true
  - type: textarea
    id: consequences
    attributes:
      label: پیامدها، اقدامات و تاریخ بازبینی
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: شواهد و پیوندها
