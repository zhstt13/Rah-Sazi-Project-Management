name: Project decision
description: Record an important decision with options, authority, evidence and consequences.
title: "[DECISION] "
labels: ["control:decision", "needs-review"]
body:
  - type: input
    id: decision_id
    attributes:
      label: Decision ID
      placeholder: DEC-001
    validations:
      required: true
  - type: input
    id: question
    attributes:
      label: Decision question
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context and observed facts
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options and trade-offs
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Decision and rationale
    validations:
      required: true
  - type: input
    id: authority
    attributes:
      label: Decision authority and date
    validations:
      required: true
  - type: textarea
    id: consequences
    attributes:
      label: Consequences, actions and review date
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and links
