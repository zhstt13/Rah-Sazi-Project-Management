name: درخواست تغییر
description: پیشنهاد تغییر کنترل‌شده در دامنه، خط مبنا، قرارداد، هزینه، برنامه یا روش اجرا.
title: "[تغییر] "
labels: ["کنترل:تغییر", "نیازمند:تأیید"]
body:
  - type: markdown
    attributes:
      value: |
        باز کردن این issue به‌معنای تأیید درخواست تغییر نیست. مرجع تأیید و شواهد باید ثبت شوند.
  - type: input
    id: change_id
    attributes:
      label: شناسهٔ تغییر
      placeholder: CHG-001
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: عنوان کوتاه
    validations:
      required: true
  - type: dropdown
    id: change_type
    attributes:
      label: نوع تغییر
      options:
        - دستور کارفرما
        - تکمیل طراحی
        - شرایط کارگاه
        - مقررات یا مرجع ذی‌صلاح
        - مهندسی ارزش
        - پیشنهاد پیمانکار
        - اصلاح
        - سایر
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: علت و شواهد
    validations:
      required: true
  - type: textarea
    id: impacts
    attributes:
      label: ارزیابی اثر
      description: اثر بر دامنه، برنامه، هزینه، کیفیت، ایمنی، محیط‌زیست، ریسک، تدارکات و قرارداد را شرح دهید. برای موارد ارزیابی‌نشده «نامعلوم» بنویسید.
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: گزینه‌های بررسی‌شده و پیشنهاد
    validations:
      required: true
  - type: input
    id: requester
    attributes:
      label: درخواست‌کننده و تأییدکنندهٔ پاسخ‌گو
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: رکوردها و پیوندهای پشتیبان
