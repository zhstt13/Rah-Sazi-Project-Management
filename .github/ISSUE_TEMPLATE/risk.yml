name: ریسک، مسئله یا فرصت
description: ثبت عدم‌قطعیت یا مسئلهٔ فعال همراه با مالک و پاسخ.
title: "[ریسک] "
labels: ["کنترل:ریسک", "نیازمند:غربال"]
body:
  - type: markdown
    attributes:
      value: |
        از این فرم برای تهدید، فرصت یا مسئله استفاده کنید. جزئیات خصوصی یا حساس ایمنی را در مخزن عمومی ننویسید.
  - type: input
    id: record_id
    attributes:
      label: شناسهٔ رکورد
      placeholder: RSK-001
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: عنوان کوتاه
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: نوع
      options:
        - تهدید
        - فرصت
        - مسئله
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: دسته
      options:
        - دامنه
        - برنامه‌ریزی
        - هزینه
        - کیفیت
        - ایمنی و بهداشت
        - محیط‌زیست
        - قرارداد
        - تدارکات
        - زمین یا تأسیسات
        - ذی‌نفع
        - فنی
        - داده یا اطلاعات
    validations:
      required: true
  - type: textarea
    id: statement
    attributes:
      label: شرح
      description: علت، رویداد و پیامد را بنویسید و واقعیت مشاهده‌شده را از فرض جدا کنید.
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: مالک پاسخ‌گو
    validations:
      required: true
  - type: dropdown
    id: likelihood
    attributes:
      label: احتمال
      options: ["1", "2", "3", "4", "5"]
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: اثر
      options: ["1", "2", "3", "4", "5"]
    validations:
      required: true
  - type: textarea
    id: response
    attributes:
      label: پاسخ و اقدام بعدی
    validations:
      required: true
  - type: input
    id: due_date
    attributes:
      label: تاریخ بازبینی یا سررسید
      placeholder: YYYY-MM-DD
  - type: textarea
    id: evidence
    attributes:
      label: شواهد و پیوندها
      description: به اسناد، رکوردها، مکان‌ها، issueها یا commitها پیوند دهید.
