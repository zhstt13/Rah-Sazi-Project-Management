name: بازرسی یا آزمایش کیفیت
description: ثبت بازرسی، آزمایش، نقطهٔ توقف، عدم انطباق یا اقدام اصلاحی.
title: "[کیفیت] "
labels: ["کنترل:کیفیت"]
body:
  - type: input
    id: inspection_id
    attributes:
      label: شناسهٔ بازرسی
      placeholder: ITP-001
    validations:
      required: true
  - type: input
    id: wbs
    attributes:
      label: WBS / BOQ / مکان
    validations:
      required: true
  - type: dropdown
    id: event_type
    attributes:
      label: نوع رویداد
      options:
        - درخواست بازرسی
        - نتیجهٔ آزمایش
        - نقطهٔ توقف
        - نقطهٔ شاهد
        - عدم انطباق
        - اقدام اصلاحی
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: الزام و معیار پذیرش
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: نتیجه
      options:
        - در انتظار
        - پذیرفته
        - پذیرفته با ملاحظه
        - ردشده
        - بسته‌شده
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: گزارش آزمایش، عکس، نقشه و پیوند شواهد
    validations:
      required: true
  - type: textarea
    id: actions
    attributes:
      label: نقص، مالک و اقدام بستن
