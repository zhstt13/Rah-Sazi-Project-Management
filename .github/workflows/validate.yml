name: اعتبارسنجی سیستم مدیریت پروژه

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت مخزن
        uses: actions/checkout@v4

      - name: آماده‌سازی پایتون
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: اعتبارسنجی قراردادها و نمونه‌های مخزن
        run: python tools/validate_repository.py

      - name: بررسی نحوی ابزارهای کنترل
        run: python -m py_compile tools/validate_repository.py tools/evm.py

      - name: اجرای محاسبهٔ آزمایشی ارزش کسب‌شده
        run: python tools/evm.py --pv 1200000 --ev 1140000 --ac 1180000
